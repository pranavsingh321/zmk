layout: {zmk_keyboard: totem}
layers:
  BASE:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - A
    - {t: S, h: LALT}
    - {t: D, h: LCTRL}
    - {t: F, h: LSHFT}
    - {t: G, h: LEFT META}
    - {t: H, h: RIGHT META}
    - {t: J, h: RSHFT}
    - {t: K, h: RCTRL}
    - {t: L, h: RIGHT ALT}
    - BACKSPACE
  - ['&td_caps', Z, X, C, V, B, N, M, ',', .]
  - - '&tmuxmode'
    - '&tmuxselect'
    - fn
    - {t: TAB, h: NAVI}
    - SPACE
    - RET
    - SYM
    - {t: ESCAPE, h: BT}
  NAVI:
  - ['&tup', PAGE UP, UP, '&msc SCRL_LEFT', '{', '}', '&msc SCRL_RIGHT', '&mmv MOVE_UP', '&msc SCRL_UP', '&tup']
  - ['&tright', LEFT, DOWN, RIGHT, '[', ']', '&mmv MOVE_LEFT', '&mmv MOVE_DOWN', '&mmv MOVE_RIGHT', '&tleft']
  - ['&tleft', '&tdown', PAGE DOWN, '&mkp MB4', '&mkp LCLK', (, ), '&mkp RCLK', '&mkp MB5', '&msc SCRL_DOWN']
  - - '&tdown'
    - '&tright'
    - ''
    - {type: held}
    - ''
    - ''
    - ''
    - ''
  SYM:
  - ['~', ., '=', <, '>', \, '7', '8', '9', '!']
  - ['*', +, '-', '"', '''', /, '4', '5', '6', '0']
  - [$, '?', '&', '%', ;, ':', '|', '1', '2', '3']
  - - '#'
    - '@'
    - '&td_grave_caret'
    - _
    - ','
    - ''
    - {type: held}
    - ''
  fn:
  - [F9, F10, F11, F12, LEFT SHIFT, ESCAPE, '7', '8', '9', '']
  - [F5, F6, F7, F8, TAB, RCTRL, '4', '5', '6', '0']
  - ['', F1, F2, F3, F4, SPACE, DELETE, '1', '2', '3']
  - - BACKSPACE
    - '&screenshot'
    - {type: held}
    - ''
    - ''
    - ''
    - RIGHT ALT
    - RIGHT META
  BT:
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - VOLUME UP
    - NEXT
    - BRIGHTNESS INC
    - ''
    - ''
  - ['', '', '', '', '', VOLUME DOWN, PREVIOUS, BRIGHTNESS DEC, '', '']
  - [BT CLR, '', '', '', '', '', MUTE, PLAY PAUSE, '', '']
  - - ''
    - ''
    - BT CLR ALL
    - ''
    - ''
    - ''
    - ''
    - {type: held}
combos:
- p: [23, 24]
  k: DELETE
  l: [BASE, SYM]
- p: [27, 28]
  k: BACKSPACE
  l: [BASE, SYM]
