layout: {zmk_keyboard: totem}
layers:
  BASE:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - {t: A, h: DELETE}
    - {t: S, h: LALT}
    - {t: D, h: LCTRL}
    - {t: F, h: LSHFT}
    - {t: G, h: LEFT META}
    - {t: H, h: RIGHT META}
    - {t: J, h: RSHFT}
    - {t: K, h: RCTRL}
    - {t: L, h: RIGHT ALT}
    - BACKSPACE
  - ['&td_caps', Z, X, C, V, B, N, M, ',', .]
  - - '&tmuxmode'
    - '&tmuxselect'
    - DEL
    - {t: TAB, h: NAVI}
    - SPACE
    - RET
    - SYM
    - ESCAPE
  NAVI:
  - ['&tup', PAGE UP, UP, '&msc SCRL_LEFT', '{', '}', '&msc SCRL_RIGHT', '&mmv MOVE_UP', '&msc SCRL_UP', '&tup']
  - ['&tright', LEFT, DOWN, RIGHT, '[', ']', '&mmv MOVE_LEFT', '&mmv MOVE_DOWN', '&mmv MOVE_RIGHT', '&tleft']
  - ['&tleft', '&tdown', PAGE DOWN, '&mkp MB4', '&mkp LCLK', (, ), '&mkp RCLK', '&mkp MB5', '&msc SCRL_DOWN']
  - - '&tdown'
    - '&tright'
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - ADJ
    - LSHFT
    - {t: ▽, type: trans}
  SYM:
  - ['~', ., '=', <, '>', \, '7', '8', '9', '!']
  - ['*', +, '-', '"', '''', /, '4', '5', '6', '0']
  - [$, '?', '&', '%', ;, ':', '|', '1', '2', '3']
  - - '#'
    - '@'
    - '&grave_caret'
    - {t: _, h: DELETE}
    - {t: ',', h: BACKSPACE}
    - ''
    - {type: held}
    - ''
  ADJ:
  - ['', '', '&delete_after_cursor', '', '', '&close', F9, F10, F11, F12]
  - ['', '', '&delete_before_cursor', '', '', '&show_desktop', F5, F6, F7, F8]
  - ['', '&sys_reset', '', '', '', '', '&screenshot', F1, F2, F3]
  - - F4
    - ''
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  BT:
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - VOLUME DOWN
    - VOLUME UP
    - MUTE
    - BRI UP
    - BRI DEC
  - ['', '', BT CLR, BT CLR ALL, '', '', '', PLAY PAUSE, '', '']
  - ['', '', '', '', '', '', '', '', '', '']
  - - ''
    - ''
    - {t: BASE, h: toggle}
    - ''
    - ''
    - ''
    - ''
    - {t: BASE, h: toggle}
combos:
- p: [32, 37]
  k: {t: BT, h: toggle}
  l: [BASE, NAVI, SYM, ADJ]
