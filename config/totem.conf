CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_KEYBOARD_NAME="TOTEM"
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_EXT_POWER=n

# Set sleep timeout to 1 hour (3600000 milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Set idle timeout to 5 minutes (300000 milliseconds)
CONFIG_ZMK_IDLE_TIMEOUT=180000

# Debounce: raise release first if a single keypress registers twice (e.g. "aa")
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=12
